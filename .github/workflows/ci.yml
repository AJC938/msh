name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No job here may mask a failure. There is deliberately no `continue-on-error`
# and no `|| true`: a red status is the point of running this at all.
permissions:
  contents: read

jobs:
  build-and-test:
    name: build + test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          ${{ matrix.cc }} --version
          make --version | head -1

      - name: Build with the full warning set
        # The warning set is in the Makefile; -Werror here turns any warning
        # that CI's compiler version reports into a failure.
        run: make CC=${{ matrix.cc }} EXTRA_CFLAGS=-Werror build

      - name: Unit + integration tests
        run: make CC=${{ matrix.cc }} test

      - name: Terminal tests through a real pty
        run: make CC=${{ matrix.cc }} test-pty

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the suite under ASan/UBSan
        run: make asan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  valgrind:
    name: Valgrind memcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Memcheck the execution paths
        # tests/integration/test_valgrind.sh carries Valgrind's own verdict on
        # a distinct exit code (99) so it cannot be confused with msh's exit
        # status. There is no suppression file, by design.
        run: make valgrind
