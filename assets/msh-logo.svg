<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="img" aria-labelledby="t d">
  <title id="t">MSH</title>
  <desc id="d">A rounded dark terminal window showing a green shell prompt chevron and a
    block cursor.</desc>

  <!-- terminal window -->
  <rect x="8" y="8" width="112" height="112" rx="22" fill="#11141a"/>
  <rect x="8" y="8" width="112" height="112" rx="22" fill="none"
        stroke="#3ddc84" stroke-width="5"/>

  <!-- title bar: one restrained divider, no fake traffic lights at this size -->
  <path d="M13 38h102" stroke="#2f3a46" stroke-width="4" stroke-linecap="round"/>
  <circle cx="26" cy="25" r="4" fill="#3ddc84"/>
  <circle cx="41" cy="25" r="4" fill="#2f3a46"/>
  <circle cx="56" cy="25" r="4" fill="#2f3a46"/>

  <!-- the prompt: a chevron and a block cursor -->
  <path d="M34 62l16 16-16 16" fill="none" stroke="#3ddc84" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="62" y="86" width="32" height="9" rx="4.5" fill="#38bdf8"/>
</svg>
