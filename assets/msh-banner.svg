<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 665" width="2000" height="665"
     role="img" aria-labelledby="title desc">
  <title id="title">MSH — Minimal Shell</title>
  <desc id="desc">The msh wordmark on a black background, with the subtitle "A Minimal
    Unix-Style Shell in C" and the tags systems programming, Linux and POSIX. Beside it a
    terminal window shows an msh session running ls -la and echo "Hello, MSH!".</desc>

  <defs>
    <!-- Generic families only: nothing is fetched over the network. -->
    <style>
      .mono { font-family: "DejaVu Sans Mono", "Liberation Mono", Menlo, Consolas, monospace; }
      .sans { font-family: Helvetica, Arial, "DejaVu Sans", sans-serif; }
    </style>
    <radialGradient id="glow" cx="38%" cy="42%" r="72%">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#070707"/>
    </radialGradient>
  </defs>

  <rect width="2000" height="665" fill="#0a0a0a"/>
  <rect width="2000" height="665" fill="url(#glow)"/>

  <!-- ============================ wordmark ============================ -->
  <g transform="translate(210 0)">
    <text class="sans" x="0" y="340" font-size="230" font-weight="bold"
          letter-spacing="-6" textLength="470" lengthAdjust="spacing">
      <tspan fill="#f2f2f2">m</tspan><tspan fill="#2ecc71">s</tspan><tspan fill="#f2f2f2">h</tspan>
    </text>
    <!-- the cursor underscore, a block rather than a typeface glyph -->
    <rect x="500" y="312" width="92" height="26" fill="#2ecc71"/>

    <text class="mono" x="0" y="404" font-size="40" fill="#ededed">
      A Minimal Unix-Style Shell in C
    </text>

    <text class="mono" x="2" y="502" font-size="32" fill="#8a8a8a" letter-spacing="1">
      SYSTEMS PROGRAMMING<tspan fill="#2ecc71">&#160;&#160;|&#160;&#160;</tspan>LINUX<tspan fill="#2ecc71">&#160;&#160;|&#160;&#160;</tspan>POSIX
    </text>
  </g>

  <!-- ============================ terminal ============================ -->
  <g>
    <rect x="1050" y="100" width="820" height="460" rx="18" fill="#141414"
          stroke="#2a2a2a" stroke-width="2"/>

    <!-- title bar -->
    <path d="M1050 118a18 18 0 0 1 18-18h784a18 18 0 0 1 18 18v42h-820z" fill="#1c1c1c"/>
    <line x1="1050" y1="160" x2="1870" y2="160" stroke="#2a2a2a" stroke-width="2"/>
    <circle cx="1088" cy="130" r="11" fill="#ff5f57"/>
    <circle cx="1124" cy="130" r="11" fill="#febc2e"/>
    <circle cx="1160" cy="130" r="11" fill="#28c840"/>
    <text class="mono" x="1460" y="139" font-size="26" fill="#8a8a8a"
          text-anchor="middle">msh</text>

    <!-- session; non-breaking spaces keep the ls columns aligned -->
    <g class="mono" font-size="23">
      <text x="1083" y="205" fill="#2ecc71">msh$</text>
      <text x="1155" y="205" fill="#ededed">ls -la</text>

      <text x="1083" y="238" fill="#d0d0d0">total 24</text>
      <text x="1083" y="271" fill="#d0d0d0">drwxr-xr-x&#160;&#160;3&#160;user&#160;user&#160;4096&#160;Oct&#160;26&#160;12:00&#160;.</text>
      <text x="1083" y="304" fill="#d0d0d0">drwxr-xr-x&#160;10&#160;user&#160;user&#160;4096&#160;Oct&#160;26&#160;11:45&#160;..</text>
      <text x="1083" y="337" fill="#d0d0d0">-rw-r--r--&#160;&#160;1&#160;user&#160;user&#160;&#160;220&#160;Oct&#160;26&#160;12:00&#160;README.md</text>
      <text x="1083" y="370" fill="#d0d0d0">drwxr-xr-x&#160;&#160;6&#160;user&#160;user&#160;4096&#160;Oct&#160;26&#160;12:00&#160;src</text>

      <text x="1083" y="432" fill="#2ecc71">msh$</text>
      <text x="1155" y="432" fill="#ededed">echo "Hello, MSH!"</text>
      <text x="1083" y="465" fill="#d0d0d0">Hello, MSH!</text>

      <text x="1083" y="503" fill="#2ecc71">msh$</text>
      <rect x="1155" y="483" width="14" height="25" fill="#2ecc71"/>
    </g>
  </g>
</svg>
